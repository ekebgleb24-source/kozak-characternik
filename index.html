<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>КОЗАЦЬКА МАФІЯ</title>

<!-- НАЛАШТУВАННЯ PWA -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Козацька Мафія">
<meta name="theme-color" content="#210b15">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fce8f3;
    background-color: #210b15 !important;
}

.game {
    position: fixed;
    top: 0; bottom: 0; left: 0; right: 0;
    width: 100%; height: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: #210b15;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

.header { padding: 12px; text-align: center; border-bottom: 1px solid #9e4b75; color: #f7c1da; font-weight: bold; }
.screen { display: none; flex: 1; flex-direction: column; padding: 15px; overflow: hidden; }
.screen.active { display: flex; }

button {
    width: 100%; padding: 14px; margin-top: 8px; border-radius: 12px;
    border: 1px solid #e58cb5; background: linear-gradient(#b84d80, #73234d);
    color: white; font-size: 16px; font-weight: bold; cursor: pointer;
}
button:active { transform: scale(.98); }
button.secondary { background: #3d1627; }
button.red { background: linear-gradient(#a33b3b, #611e1e); border-color: #ff8585; }

.title { text-align: center; color: #f7c1da; font-size: 22px; margin-bottom: 10px; }
.counter { display: flex; align-items: center; justify-content: center; gap: 20px; margin: auto 0; }
.number { font-size: 42px; font-weight: bold; color: #f7c1da; }

.role-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; }
.role-row { display: flex; align-items: center; gap: 8px; padding: 8px; background: #2e101f; border: 1px solid #9e4b75; border-radius: 10px; }
.role-controls { display: flex; align-items: center; gap: 6px; margin-left: auto; }

.card-container { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; }
.card { 
    height: 100%; max-height: 400px; aspect-ratio: 5 / 7; 
    border: 2px solid #e58cb5; border-radius: 16px;
    background-size: cover; background-position: center; display: flex;
    flex-direction: column; justify-content: flex-end; padding: 12px;
}
.card-text-bg { background: rgba(33, 11, 21, 0.9); padding: 10px; border-radius: 8px; text-align: center; }

.hidden { display: none !important; }
input { width: 100%; padding: 10px; background: #12050b; border: 1px solid #9e4b75; border-radius: 8px; color: white; }
</style>
</head>
<body>

<div class="game">
    <div class="header">КОЗАЦЬКА МАФІЯ</div>

    <section id="home" class="screen active">
        <div style="margin: auto; text-align: center;"><h1>Козацька<br>Мафія</h1></div>
        <button onclick="showScreen('players')">ПОЇХАЛИ</button>
    </section>

    <section id="players" class="screen">
        <div class="title">Кількість козаків</div>
        <div class="counter">
            <button onclick="changePlayers(-1)" style="width:50px; height:50px; border-radius:50%;">−</button>
            <div id="playerNumber" class="number">8</div>
            <button onclick="changePlayers(1)" style="width:50px; height:50px; border-radius:50%;">+</button>
        </div>
        <button onclick="showRoles()">ДАЛІ</button>
    </section>

    <section id="roles" class="screen">
        <div class="title">Виберіть ролі</div>
        <div id="roleList" class="role-list"></div>
        <button onclick="showNames()">ДАЛІ</button>
    </section>

    <section id="names" class="screen">
        <div class="title">Назви гравців</div>
        <div id="namesList" class="role-list"></div>
        <button onclick="startDeal()">РОЗДАТИ КАРТИ</button>
    </section>

    <section id="deal" class="screen">
        <div class="title" id="dealPlayer"></div>
        <div class="card-container">
            <div id="closedCard" class="card" style="background-color: #3d1627;">
                <div class="card-text-bg"><h3>Таємна карта</h3><p>Натисніть показати</p></div>
            </div>
            <div id="openCard" class="card hidden">
                <div class="card-text-bg"><h3 id="roleTitle"></h3><p id="roleDesc"></p></div>
            </div>
        </div>
        <button id="showButton" onclick="showRole()">ПОКАЗАТИ</button>
        <button id="hideButton" class="secondary hidden" onclick="hideRole()">СХОВАТИ</button>
        <button id="nextButton" class="hidden" onclick="nextPlayer()">ДАЛІ</button>
    </section>

    <section id="voting" class="screen">
        <div class="title">ГОЛОСУВАННЯ</div>
        <div id="votingList" class="role-list"></div>
    </section>

    <section id="end" class="screen">
        <div class="title" id="winnerTitle"></div>
        <button onclick="location.reload()">НОВА ГРА</button>
    </section>
</div>

<script>
let playerCount = 8, players = [], roleCounts = {}, currentPlayer = 0;

const roles = {
    peasant: { name: "Селянин", desc: "Мирний житель." },
    characternik: { name: "Козак-характерник", desc: "Ви — Мафія. Вбивайте вночі." }
};

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function changePlayers(v) {
    playerCount = Math.max(4, Math.min(20, playerCount + v));
    document.getElementById("playerNumber").textContent = playerCount;
}

function showRoles() {
    const list = document.getElementById("roleList");
    list.innerHTML = "";
    Object.keys(roles).forEach(key => {
        roleCounts[key] = roleCounts[key] || 0;
        list.innerHTML += `<div class="role-row">${roles[key].name} <div class="role-controls"><button onclick="adjustRole('${key}',-1)">-</button><span id="c-${key}">${roleCounts[key]}</span><button onclick="adjustRole('${key}',1)">+</button></div></div>`;
    });
    showScreen("roles");
}

function adjustRole(k, v) {
    let total = Object.values(roleCounts).reduce((a,b)=>a+b, 0);
    if(v > 0 && total >= playerCount) return;
    roleCounts[k] = Math.max(0, roleCounts[k] + v);
    document.getElementById("c-"+k).textContent = roleCounts[k];
}

function showNames() {
    const list = document.getElementById("namesList");
    list.innerHTML = "";
    for(let i=0; i<playerCount; i++) list.innerHTML += `<input id="n${i}" placeholder="Гравець ${i+1}" style="margin-bottom:5px;">`;
    showScreen("names");
}

function startDeal() {
    let deck = [];
    Object.keys(roleCounts).forEach(k => { for(let i=0; i<roleCounts[k]; i++) deck.push(k); });
    deck.sort(() => Math.random() - 0.5);
    for(let i=0; i<playerCount; i++) {
        players.push({ name: document.getElementById("n"+i).value || "Козак "+(i+1), role: deck[i] || "peasant", alive: true });
    }
    currentPlayer = 0;
    prepareCard();
    showScreen("deal");
}

function prepareCard() {
    document.getElementById("dealPlayer").textContent = players[currentPlayer].name;
    document.getElementById("closedCard").classList.remove("hidden");
    document.getElementById("openCard").classList.add("hidden");
    document.getElementById("showButton").classList.remove("hidden");
    document.getElementById("hideButton").classList.add("hidden");
    document.getElementById("nextButton").classList.add("hidden");
}

function showRole() {
    let r = roles[players[currentPlayer].role];
    document.getElementById("roleTitle").textContent = r.name;
    document.getElementById("roleDesc").textContent = r.desc;
    document.getElementById("closedCard").classList.add("hidden");
    document.getElementById("openCard").classList.remove("hidden");
    document.getElementById("showButton").classList.add("hidden");
    document.getElementById("hideButton").classList.remove("hidden");
}

function hideRole() {
    document.getElementById("openCard").classList.add("hidden");
    document.getElementById("closedCard").classList.remove("hidden");
    document.getElementById("hideButton").classList.add("hidden");
    document.getElementById("nextButton").classList.remove("hidden");
}

function nextPlayer() {
    currentPlayer++;
    if(currentPlayer < playerCount) prepareCard();
    else startVoting();
}

function startVoting() {
    const list = document.getElementById("votingList");
    list.innerHTML = "";
    players.forEach((p, i) => {
        if(p.alive) list.innerHTML += `<button class="red" onclick="eliminate(${i})">Вигнати ${p.name}</button>`;
    });
    showScreen("voting");
}

function eliminate(i) {
    players[i].alive = false;
    alert(players[i].name + " вибув.");
    
    let alive = players.filter(p => p.alive);
    let mafia = alive.filter(p => p.role === "characternik");

    if (mafia.length === 0) {
        document.getElementById("winnerTitle").textContent = "Козаки перемогли!";
        showScreen("end");
    } else if (alive.length === mafia.length) {
        document.getElementById("winnerTitle").textContent = "Характерник переміг!";
        showScreen("end");
    } else {
        startVoting();
    }
}
</script>
</body>
</html>
